<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pibu · ZK 기록 레이어</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="logo">◐</span>
      <div>
        <div class="brand-name">Pibu <span class="brand-tag">ZK 기록 레이어</span></div>
        <div class="brand-sub">병원은 차트를 보지 않고, 증명만 본다</div>
      </div>
    </div>
    <nav id="personas" class="personas"></nav>
    <a class="btn tiny ghost" href="/ledger" style="text-decoration:none;color:inherit">공개 원장 보기 →</a>
    <div class="chain-pill" id="chain-pill">Base Sepolia</div>
  </header>

  <main class="grid">
    <!-- LEFT: the patient's device -->
    <section class="col device">
      <div class="col-head"><span class="badge private">ON-DEVICE · PRIVATE</span><h2>내 시술 지갑</h2></div>
      <div id="profile" class="card profile"></div>
      <div class="card">
        <div class="card-title">✓ 병원 확인 기록 <span class="muted">· 체인에 해시로 앵커 · 증명에 사용</span></div>
        <ul id="verified" class="records"></ul>
      </div>
      <details class="card" id="self-box">
        <summary class="card-title" id="self-title"></summary>
        <ul id="self" class="records self"></ul>
      </details>
      <div class="card anchor">
        <div class="card-title">블록체인에 공개되는 전부</div>
        <div id="anchor"></div>
      </div>
      <button class="btn ghost reset-btn" data-act="reset">↺ 이 페르소나 초기화 (리허설용)</button>
    </section>

    <!-- CENTER: scenes -->
    <section class="col scenes">
      <div class="col-head"><span class="badge agent">데모 장면 (docs/spec 시나리오)</span><h2>오퍼·기록·후기를 ZK로</h2></div>
      <div id="scene-list"></div>
      <div class="card">
        <div class="card-title">이 사람에게 온 오퍼 <span class="muted">· 매칭은 기기 안에서 (병원은 '해당 없음'을 모름)</span></div>
        <div id="offers"></div>
      </div>
      <details class="card sim">
        <summary>수동: 시술 완료 → 병원 확인 기록 발급</summary>
        <div class="row"><select id="visit-clinic"></select><select id="visit-proc"></select></div>
        <button id="visit-btn" class="btn ghost">기록 발급 (append 증명 → Base Sepolia)</button>
      </details>
      <div id="review-box"></div>
    </section>

    <!-- RIGHT: what clinics / the public see -->
    <section class="col net">
      <div class="col-head">
        <span class="badge public">WHAT CLINICS SEE</span>
        <div class="tabs"><button data-tab="log" class="tab active">병원이 받은 것</button><button data-tab="rank" class="tab">검증 방문 · 리뷰</button></div>
      </div>
      <div id="log" class="log tabpane"></div>
      <div id="rank" class="rank tabpane hidden"></div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
