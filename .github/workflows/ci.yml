name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    # The e2e server runs the production build: DEMO_MODE gives auth its dev-only secret and opens the demo
    # surfaces, the same mode the deployed demo uses. No real secrets in CI.
    env:
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # click-through of the landing flows against the build above, with the Chrome that ubuntu runners ship
      - run: npm run test:e2e
      - run: node scripts/verify-spec.mjs all
